
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b285c">
<meta name="description" content="Framboise, ton petit espace pour t'organiser, étudier et te détendre.">
<title>Framboise 🍇</title>

<style>
:root {
  --accent: #a52d68;
  --accent-dark: #70204f;
  --bg: #fff5fa;
  --card: #ffffff;
  --text: #402338;
  --muted: #98788b;
  --border: #f0dce8;
  --soft: #fbe5f0;
  --shadow: 0 8px 25px #65254b12;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background .2s, color .2s;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

header {
  background: linear-gradient(125deg, var(--accent-dark), var(--accent));
  color: white;
  padding: 22px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.logo { font-size: 27px; font-weight: bold; }
.subtitle { font-size: 13px; opacity: .9; margin-top: 5px; }

header button {
  border: 1px solid #ffffff80;
  background: #ffffff18;
  color: white;
  border-radius: 12px;
  padding: 10px 13px;
}

nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 14px 10px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
}

nav button {
  background: transparent;
  border: none;
  color: var(--muted);
  border-radius: 12px;
  padding: 11px 14px;
}

nav button.active, nav button:hover {
  background: var(--soft);
  color: var(--accent);
}

main {
  width: min(1050px, 92%);
  margin: 28px auto 60px;
}

.page { display: none; }
.page.active { display: block; }

h1 { font-size: clamp(23px, 4vw, 32px); margin: 0 0 10px; }
h2 { font-size: 19px; margin-top: 0; }
p { line-height: 1.6; }

.muted { color: var(--muted); }
.small { font-size: 13px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin: 22px 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 21px;
  box-shadow: var(--shadow);
}

.stat-number {
  color: var(--accent);
  font-size: 32px;
  font-weight: bold;
  margin-top: 10px;
}

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b174f">
  <title>Framboise — mon petit cocon</title>
  <style>
    :root {
      --berry: #c52d58;
      --berry-deep: #8f204b;
      --plum: #58245f;
      --plum-deep: #35183d;
      --lavender: #e8d9f2;
      --cream: #fff8f3;
      --paper: #fffdfb;
      --ink: #39263d;
      --muted: #927e96;
      --line: #f0e5ef;
      --soft: #faedf3;
      --shadow: 0 18px 45px rgba(76, 28, 77, .09);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 208, 222, .65), transparent 27rem),
        radial-gradient(circle at 88% 88%, rgba(221, 198, 244, .6), transparent 30rem),
        var(--cream);
    }

    button, input, select, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(197,45,88,.25);
      outline-offset: 3px;
    }

    .app {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      padding: 27px 17px;
      background: rgba(255,253,251,.82);
      border-right: 1px solid rgba(230,211,231,.75);
      display: flex;
      flex-direction: column;
      gap: 26px;
      position: sticky;
      top: 0;
      height: 100vh;
      backdrop-filter: blur(18px);
    }

    .brand {
      display:flex;
      align-items:center;
      gap: 11px;
      padding: 0 10px;
    }

    .berry-mark {
      width: 47px;
      height: 47px;
      flex: 0 0 47px;
      filter: drop-shadow(0 5px 8px #b82e5730);
    }

    .brand-name {
      font-size: 24px;
      letter-spacing: -.9px;
      font-weight: 900;
      color: var(--plum);
    }

    .brand-sub {
      display:block;
      margin-top:3px;
      font-size:11px;
      color:var(--muted);
      font-weight:500;
      letter-spacing:.3px;
    }

    .side-label {
      margin: 0 12px 8px;
      text-transform: uppercase;
      font-size:10px;
      letter-spacing:1.7px;
      font-weight:800;
      color:#b19ab6;
    }

    .nav { display:grid; gap:7px; }

    .nav-btn {
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      border:0;
      background:transparent;
      color:#806b87;
      padding:12px 13px;
      border-radius:15px;
      cursor:pointer;
      text-align:left;
      transition:.2s;
    }

    .nav-btn .paw {
      font-size:18px;
      width:25px;
      text-align:center;
    }

    .nav-btn:hover {
      background:#fbf0f5;
      transform:translateX(2px);
    }

    .nav-btn.active {
      background:linear-gradient(110deg,var(--berry),var(--plum));
      color:white;
      box-shadow:0 8px 18px #7c285020;
    }

    .sidebar-bottom { margin-top:auto; }

    .cozy-note {
      padding:15px;
      border-radius:18px;
      background:linear-gradient(140deg,#fff0f4,#f0e5fb);
      color:#866b8d;
      font-size:12px;
      line-height:1.6;
    }

    .cozy-note strong {
      display:block;
      color:var(--plum);
      font-size:13px;

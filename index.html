<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8e8f1">
<meta name="description" content="Framboise, ton petit espace pour t'organiser, étudier et te concentrer.">
<title>Framboise 🍇</title>

<style>
:root {
  --bg: #fff7fb;
  --surface: #ffffff;
  --surface2: #fff0f7;
  --text: #51384d;
  --muted: #987b91;
  --accent: #d66aa0;
  --accent2: #a984d6;
  --border: #f0d9e8;
  --shadow: 0 8px 25px rgba(145, 86, 125, .10);
}
body[data-theme="purple"] {
  --bg:#faf6ff; --surface:#fff; --surface2:#f0e8ff;
  --text:#49375d; --muted:#89749e; --accent:#9874d8;
  --accent2:#c39be8; --border:#e7daf8;
}
body[data-theme="rose"] {
  --bg:#fff6f5; --surface:#fff; --surface2:#ffe9e8;
  --text:#633d49; --muted:#a07b85; --accent:#e77d91;
  --accent2:#f3b1bd; --border:#f7d9dd;
}
body[data-theme="plum"] {
  --bg:#f8f3fa; --surface:#fff; --surface2:#eee2f4;
  --text:#49344e; --muted:#8b7590; --accent:#9562a5;
  --accent2:#c59acb; --border:#e4d2e9;
}
body.dark {
  --bg:#211a29; --surface:#302638; --surface2:#3a2c43;
  --text:#f7eaf5; --muted:#c2a9c1; --accent:#e795c1;
  --accent2:#c3a1f0; --border:#4c3b52;
  --shadow:0 8px 25px rgba(0,0,0,.2);
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Trebuchet MS",Arial,sans-serif;
  transition:background .3s,color .3s;
}
button,input,select,textarea { font:inherit; }
button {
  border:0; border-radius:14px; padding:11px 15px;
  background:var(--surface2); color:var(--text);
  cursor:pointer; transition:transform .2s,opacity .2s;
}
button:hover { transform:translateY(-2px); }
button:focus-visible,input:focus-visible,select:focus-visible {
  outline:3px solid var(--accent2); outline-offset:2px;
}
button.primary { background:var(--accent); color:white; }
button.secondary { border:1px solid var(--border); }
button.danger { background:#ffe4e8; color:#a83f5c; }
input,select,textarea {
  width:100%; padding:12px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text);
}
label { display:block; margin:10px 0 6px; font-size:.92rem; }
h1 { font-size:clamp(1.7rem,4vw,2.3rem); margin:8px 0 12px; }
h2 { font-size:1.2rem; }
p { line-height:1.6; }
.muted { color:var(--muted); }
header {
  padding:24px 18px 18px; text-align:center;
  background:linear-gradient(135deg,var(--surface2),var(--bg));
}
.logo { font-size:2.3rem; }
header p { margin:6px 0; }
nav {
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
  padding:12px; position:sticky; top:0; z-index:10;
  background:var(--bg); border-bottom:1px solid var(--border);
}
nav button { font-size:.92rem; padding:10px 13px; }
nav button.active { background:var(--accent); color:white; }
main { max-width:1000px; margin:auto; padding:24px 16px 60px; }
.page { display:none; animation:fadeIn .3s ease; }
.page.active { display:block; }
@keyframes fadeIn {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; transform:translateY(0); }
}
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:22px; padding:20px; margin:16px 0;
  box-shadow:var(--shadow);
}
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.row > * { flex:1; }
.row button { flex:0 0 auto; }
.task-item {
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 0; border-bottom:1px solid var(--border);
}
.task-item:last-child { border-bottom:0; }
.task-item input[type="checkbox"] { width:20px; margin-top:4px; accent-color:var(--accent); }
.task-content { flex:1; min-width:0; }
.task-content strong { overflow-wrap:anywhere; }
.task-content small { display:block; margin-top:5px; color:var(--muted); }
.task-item.done .task-content strong {
  text-decoration:line-through; opacity:.6;
}
.tag {
  display:inline-block; border-radius:20px; padding:4px 9px;
  background:var(--surface2); font-size:.78rem; margin-top:6px;
}
.empty { text-align:center; color:var(--muted); padding:22px 8px; }
footer { text-align:center; padding:24px; color:var(--muted); }
.calendar-head {
  display:flex; justify-content:space-between; align-items:center; gap:12px;
}
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.calendar-day-name { text-align:center; padding:8px 0; font-size:.8rem; color:var(--muted); }
.calendar-day {
  min-height:65px; padding:7px 2px; border:1px solid var(--border);
  background:var(--surface); border-radius:12px; text-align:center;
  font-size:.9rem; cursor:pointer;
}
.calendar-day.today { border:2px solid var(--accent); }
.calendar-day.selected { background:var(--surface2); }
.calendar-day .dot { color:var(--accent); font-size:1.2rem; line-height:1; }
.calendar-detail { margin-top:18px; }
